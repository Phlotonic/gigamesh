[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gigamesh"
version = "1.0.0"
description = "GigaMesh — Self-Evolving Agentic & Industrial OT Security-First Unified Namespace (S-UNS) SIEM"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later OR Commercial" }
authors = [
  { name = "Adam Dryden", email = "adryden508@gmail.com" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "networkx>=3.4.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "cryptography>=43.0.0",
  "PyJWT>=2.9.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gigamesh*"]
