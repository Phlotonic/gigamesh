# Hardened Mosquitto MQTT 5.0 Configuration for GigaMesh + Ignition Sparkplug B
# For production plant deployments, enable TLS certificates on listener 8883 and password_file/ACL.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
allow_anonymous true
max_packet_size 1048576
max_inflight_messages 100
